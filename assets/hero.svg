<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/><stop offset="0.55" stop-color="#0b1330"/><stop offset="1" stop-color="#11072b"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5d4"/><stop offset="0.5" stop-color="#36bcf7"/><stop offset="1" stop-color="#b967ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .m{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}
      .l{font-size:15px;fill:#9fb3d9;opacity:0}
      .g{fill:#00f5d4}.b{fill:#36bcf7}.p{fill:#b967ff}.w{fill:#e8efff}
      .l1{animation:s 0.1s .3s forwards}.l2{animation:s 0.1s 1.1s forwards}
      .l3{animation:s 0.1s 1.9s forwards}.l4{animation:s 0.1s 2.7s forwards}
      .l5{animation:s 0.1s 3.5s forwards}.l6{animation:s 0.1s 4.3s forwards}
      @keyframes s{to{opacity:1}}
      .cur{animation:bl 1s steps(1) infinite}
      @keyframes bl{50%{opacity:0}}
      .name{animation:pulse 4s ease-in-out infinite}
      @keyframes pulse{50%{opacity:.82}}
      .orb{animation:fl 6s ease-in-out infinite}
      @keyframes fl{50%{transform:translateY(-10px)}}
      .scan{animation:sc 5s linear infinite}
      @keyframes sc{from{transform:translateY(-40px)}to{transform:translateY(340px)}}
    </style>
  </defs>
  <rect width="900" height="330" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="328" rx="17" fill="none" stroke="url(#ac)" stroke-opacity=".6" stroke-width="2"/>
  <circle class="orb" cx="800" cy="80" r="70" fill="#b967ff" opacity=".10"/>
  <circle class="orb" cx="740" cy="250" r="45" fill="#00f5d4" opacity=".10" style="animation-delay:1.5s"/>
  <rect class="scan" x="0" y="0" width="900" height="30" fill="url(#ac)" opacity=".05"/>
  <circle cx="28" cy="26" r="6" fill="#ff5f57"/><circle cx="48" cy="26" r="6" fill="#febc2e"/><circle cx="68" cy="26" r="6" fill="#28c840"/>
  <text class="m" x="90" y="31" font-size="12" fill="#5d6f99">srinivas@hackspace:~ — zsh</text>

  <text class="m name" x="40" y="105" font-size="46" font-weight="800" fill="url(#ac)" filter="url(#glow)">SRINIVAS DEVALLA</text>
  <text class="m w" x="42" y="138" font-size="17" opacity=".92">Full-Stack AI &amp; ML Engineer · President, HackSpace Club</text>

  <text class="m l l1" x="42" y="188"><tspan class="g">$</tspan> whoami <tspan class="w">→ builds scalable systems + intelligent AI</tspan></text>
  <text class="m l l2" x="42" y="214"><tspan class="g">$</tspan> stack <tspan class="b">→ Java · Spring Boot · React · Python · PostgreSQL</tspan></text>
  <text class="m l l3" x="42" y="240"><tspan class="g">$</tspan> ai <tspan class="p">→ ML · NLP · Agentic AI · LLMs · SHAP explainability</tspan></text>
  <text class="m l l4" x="42" y="266"><tspan class="g">$</tspan> wins <tspan class="w">→ Cognizant Runner-Up · VISIONAVA Top Performer</tspan></text>
  <text class="m l l5" x="42" y="292"><tspan class="g">$</tspan> lead <tspan class="w">→ 100+ students · national hackathons</tspan></text>
  <text class="m l l6" x="42" y="318"><tspan class="g">$</tspan> status <tspan class="g">→ OPEN TO HIRE (2027 graduate)</tspan><tspan class="g cur"> ▋</tspan></text>
</svg>
